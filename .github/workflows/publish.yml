name: Publish plugins

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'scripts/**'
      - 'tests/**'
      - 'sdk/**'
      - 'catalog-v2.json'
      - 'catalog-v3.json'
      - 'package.json'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-plugins
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
      - name: Install pinned plugin build dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Build isolated plugin resources
        run: npm run build:plugins
      - name: Validate publisher
        run: python3 -m unittest discover -s tests -v
      - name: Publish releases and catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          python3 scripts/publish.py
